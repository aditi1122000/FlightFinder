name: Scrape travel cards

# Diagram: "Travel cards — batch scrape"
# Public comparison listings → credit_cards (travel cards only).
# Cadence: Mon/Wed/Fri once (IST 07:30).
on:
  schedule:
    - cron: "0 2 * * 1,3,5"
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape catalogue → credit_cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_offers.py --only catalog
