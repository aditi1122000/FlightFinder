name: Refresh route watch

# Optional fare-API batch (not HTML scrape): recent routes → fare_discounts,
# six watched routes → route_watch. Needs RapidAPI secrets.
# Cadence: paused (manual only). Was Mon/Wed/Fri IST 08:15 — cron "45 2 * * 1,3,5".
on:
  workflow_dispatch:

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Price watched + recent routes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
        run: python scripts/refresh_offers.py --only routes,watch
